<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>财报直达 · Financial Reports Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>📊 财报直达</h1>
    <p class="subtitle">搜任意公司，点一下直达它在官方网站上的最新年报 / 季报。覆盖美股、A股、港股全部上市公司。</p>
    <div class="toolbar">
      <input id="search" type="search" placeholder="搜索公司名或代码…  例如 茅台 / 600519 / AAPL / 腾讯 / 00700" autocomplete="off" />
      <div class="tabs" id="tabs">
        <button data-market="all" class="active">全部</button>
        <button data-market="us">美股</button>
        <button data-market="cn">A股</button>
        <button data-market="hk">港股</button>
      </div>
    </div>
    <div class="meta">
      <span id="result-count">—</span>
      <span class="dot">·</span>
      <span id="total">加载中…</span>
    </div>
  </header>

  <main id="grid"></main>

  <footer>
    <p>
      数据来源：美股 <a href="https://www.sec.gov/edgar" target="_blank" rel="noopener">SEC EDGAR</a> ·
      A股 <a href="https://www.cninfo.com.cn" target="_blank" rel="noopener">巨潮资讯</a> ·
      港股 <a href="https://www1.hkexnews.hk" target="_blank" rel="noopener">HKEXnews</a>。
      点击后跳转到官方网站上该公司已按最新排序的财报列表。
    </p>
    <p class="updated">目录更新：<span id="updated">—</span></p>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
