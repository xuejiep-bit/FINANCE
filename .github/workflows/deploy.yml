name: Deploy to Cloudflare

# 每次 push（或手动触发）就用 wrangler 把 Worker + 网站一起部署到 Cloudflare。
# 需要在 GitHub 仓库 Settings → Secrets and variables → Actions 里设置：
#   CLOUDFLARE_API_TOKEN   （必填）创建方式见 README
#   CLOUDFLARE_ACCOUNT_ID  （账号下有多个时填，单账号可不填）
on:
  push:
    branches: [main, master, claude/laughing-cerf-fbio96]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 清洗密钥：去掉粘贴时可能混入的空格/换行（否则会报 "invalid header value"）
      - name: Sanitize Cloudflare secrets
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "CF_API_TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "CF_ACCOUNT_ID=$(printf '%s' "$RAW_ACCT" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          # 用 4.x：新的 [assets]（Worker 顺带托管网站）需要较新的 wrangler，
          # 否则 action 默认装 3.90 可能部署失败。
          wranglerVersion: "4.98.0"
